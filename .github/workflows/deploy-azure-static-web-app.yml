New deploy script name: Build and Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RESOURCE_GROUP:    aiatc-rg
  BFF_APP_NAME:      aiatc-bff
  SCENARIO_APP_NAME: aiatc-scenario

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - uses: actions/checkout@v4

      # Patch the Blazor WASM appsettings.json before the Docker build bakes it
      # into the BFF image. Only runs on push to main — PRs retain the localhost
      # placeholder, which is fine since they never deploy.
      - name: Inject ScenarioService URL into WASM appsettings
        if: github.event_name == 'push'
        run: |
          jq --arg url "${{ secrets.SCENARIO_SERVICE_URL }}" \
            '.ScenarioService.Address = $url' \
            src/AIATC.Web/wwwroot/appsettings.json > tmp.json
          mv tmp.json src/AIATC.Web/wwwroot/appsettings.json
          echo "ScenarioService.Address → ${{ secrets.SCENARIO_SERVICE_URL }}"

      # Build both images locally. Using a local tag keeps the build step
      # secret-free so it also works on PRs and fork contributions.
      - name: Build BFF image
        run: |
          docker build \
            -f src/AIATC.BFF/Dockerfile \
            -t aiatc-bff:${{ github.sha }} \
            .

      - name: Build ScenarioService image
        run: |
          docker build \
            -f src/AIATC.ScenarioService/Dockerfile \
            -t aiatc-scenario-service:${{ github.sha }} \
            .

      # ── Push and deploy — push to main only ─────────────────────────────────

      - name: Azure login
        if: github.event_name == 'push'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Push images to ACR
        if: github.event_name == 'push'
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

          BFF_TAG=${{ secrets.ACR_LOGIN_SERVER }}/aiatc-bff:${{ github.sha }}
          SCENARIO_TAG=${{ secrets.ACR_LOGIN_SERVER }}/aiatc-scenario-service:${{ github.sha }}

          docker tag aiatc-bff:${{ github.sha }} $BFF_TAG
          docker tag aiatc-scenario-service:${{ github.sha }} $SCENARIO_TAG

          docker push $BFF_TAG
          docker push $SCENARIO_TAG

      - name: Deploy BFF Container App
        if: github.event_name == 'push'
        run: |
          az containerapp update \
            --name ${{ env.BFF_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/aiatc-bff:${{ github.sha }} \
            --min-replicas 1

      - name: Deploy ScenarioService Container App
        if: github.event_name == 'push'
        run: |
          az containerapp update \
            --name ${{ env.SCENARIO_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/aiatc-scenario-service:${{ github.sha }} \
            --min-replicas 1
