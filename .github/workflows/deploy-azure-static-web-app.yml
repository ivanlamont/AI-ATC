name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - master

env:
  DOTNET_VERSION: '10.0.x'
  APP_LOCATION: "src/AIATC.Web"

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build and publish application
        run: |
          # Build the Blazor WebAssembly app
          dotnet publish src/AIATC.Web -c Release -o publish/web --nologo
          
          # Copy static web app configuration from root to ensure it's present
          cp staticwebapp.config.json publish/web/wwwroot/
          
          # Verify index.html exists
          if [ ! -f "publish/web/wwwroot/index.html" ]; then
            echo "ERROR: index.html not found in publish directory"
            ls -la publish/web/wwwroot/
            exit 1
          fi
          
          # Verify staticwebapp.config.json exists
          if [ ! -f "publish/web/wwwroot/staticwebapp.config.json" ]; then
            echo "ERROR: staticwebapp.config.json not found in publish directory"
            exit 1
          else
            echo "✓ staticwebapp.config.json found"
          fi
          
          # Remove any web.config files that might interfere with Azure Static Web Apps
          rm -f publish/web/wwwroot/web.config
          
          echo "✓ Application built successfully"
          echo "Files in wwwroot:"
          ls -la publish/web/wwwroot/ | head -15
        working-directory: ./

      - name: Deploy to Azure Static Web Apps
        run: |
          # Install SWA CLI
          npm install -g @azure/static-web-apps-cli
          
          # Deploy using the deployment token
          npx @azure/static-web-apps-cli deploy \
            --deployment-token "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}" \
            --app-location "./publish/web/wwwroot" \
            --env "production" \
            --verbose

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
