apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aiatc.fullname" . }}-web
  labels:
    {{- include "aiatc.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "aiatc.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "aiatc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
      {{- if .Values.web.dapr.enabled }}
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: {{ .Values.web.dapr.appId | quote }}
        dapr.io/app-port: {{ .Values.web.dapr.appPort | quote }}
        dapr.io/enable-api-logging: "true"
      {{- end }}
    spec:
      containers:
      - name: web
        image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
        imagePullPolicy: {{ .Values.web.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.web.service.targetPort }}
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          {{- toYaml .Values.web.resources | nindent 12 }}
        env:
        {{- range $key, $value := .Values.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: {{ include "aiatc.fullname" . }}-usage-db
              key: connection-string
        - name: Redis__Connection
          valueFrom:
            secretKeyRef:
              name: {{ include "aiatc.fullname" . }}-redis
              key: connection-string
        - name: ScenarioService__Address
          value: "http://{{ include "aiatc.fullname" . }}-scenario-service:5001"
